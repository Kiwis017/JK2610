<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17684f">
  <title>10月13日文創小店 · 西双版纳行程</title>
  <style>
    :root {
      --green: #17684f; --green-dark: #124f40; --teal: #147681; --orange: #db8244;
      --ink: #263a33; --muted: #718079; --paper: #f4f8f4; --card: #fff; --line: #dce8df;
      --shadow: 0 12px 34px rgba(27, 73, 54, .09);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      min-width: 320px; margin: 0; color: var(--ink);
      background: radial-gradient(circle at 90% 8%, rgba(212,235,222,.75), transparent 28rem), var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .topbar {
      min-height: 66px; padding: env(safe-area-inset-top) max(5vw, env(safe-area-inset-right)) 0 max(5vw, env(safe-area-inset-left));
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      background: rgba(255,255,255,.92); border-bottom: 1px solid rgba(220,232,223,.9);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    }
    .brand { text-decoration: none; font-weight: 900; color: var(--green-dark); letter-spacing: .2px; }
    .back {
      display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 14px;
      border: 1px solid var(--line); border-radius: 999px; text-decoration: none;
      color: var(--green-dark); font-size: 13px; font-weight: 800; background: #fff; white-space: nowrap;
    }
    .wrap { width: min(1120px, calc(100% - 36px)); margin: 0 auto; padding-right: env(safe-area-inset-right); padding-left: env(safe-area-inset-left); }
    .hero {
      position: relative; overflow: hidden; margin: 34px auto 24px; padding: clamp(26px, 4.5vw, 46px);
      border-radius: 28px; color: #fff; background: linear-gradient(120deg, #15583f, #187b78); box-shadow: var(--shadow);
    }
    .hero::after {
      content: "🎁"; position: absolute; right: 7%; bottom: -25px; font-size: clamp(100px, 20vw, 190px);
      opacity: .13; transform: rotate(-12deg); pointer-events: none;
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px;
      border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
      background: rgba(255,255,255,.1); font-size: 12px; font-weight: 900; letter-spacing: .8px;
    }
    h1 { max-width: 650px; margin: 18px 0 10px; font-size: clamp(32px, 6vw, 52px); line-height: 1.12; letter-spacing: -.7px; }
    .hero p { max-width: 620px; margin: 0; color: rgba(255,255,255,.84); line-height: 1.8; font-size: 15px; }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; width: 100%; margin: 30px auto 15px; }
    .section-head h2 { margin: 0; font-size: 23px; color: var(--green-dark); }
    .section-head p { margin: 0; color: var(--muted); font-size: 13px; }
    .shop-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; width: 100%; margin: 0 auto; }
    .shop-card {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 28%);
      grid-template-rows: auto 1fr; align-items: start; gap: 16px 24px;
      min-width: 0; padding: 24px; border: 1px solid var(--line); border-radius: 20px;
      background: var(--card); box-shadow: var(--shadow); transition: transform .2s, box-shadow .2s;
    }
    .shop-card:hover { transform: translateY(-3px); box-shadow: 0 17px 38px rgba(27, 73, 54, .14); }
    .shop-card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
    .shop-name { color: var(--green-dark); font-size: 19px; font-weight: 900; line-height: 1.4; }
    .shop-details { display: grid; align-content: start; gap: 5px; min-width: 0; font-size: 14.5px; line-height: 1.65; color: var(--ink); overflow-wrap: anywhere; }
    .shop-details p { margin: 0; }
    .hours {
      display: inline-flex; align-items: center; min-height: 30px; padding: 4px 10px;
      border-radius: 999px; background: #fff3e8; color: #76533a; font-size: 12px; font-weight: 800; white-space: normal;
    }
    .shop-placeholder {
      display: flex; grid-column: 2; grid-row: 1 / span 2; align-items: center; justify-content: center;
      width: 100%; min-height: 360px; border-radius: 12px;
      font-size: 90px; background: linear-gradient(145deg, #e8f3ec, #d4ebe0);
    }
    .note {
      margin: 18px 0 34px; padding: 14px 17px; border-left: 4px solid var(--orange);
      border-radius: 0 12px 12px 0; background: #fff6ed; color: #76533a; font-size: 13px; line-height: 1.7;
    }
    footer { padding: 24px 18px max(34px, env(safe-area-inset-bottom)); text-align: center; color: var(--muted); font-size: 12px; }
    footer a { color: var(--green); font-weight: 800; }
    .home-float {
      position: fixed; z-index: 20; left: max(16px, env(safe-area-inset-left)); right: auto; bottom: max(18px, env(safe-area-inset-bottom));
      display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 48px; padding: 0 17px;
      border: 1px solid rgba(255,255,255,.5); border-radius: 999px; color: #fff;
      background: linear-gradient(120deg, var(--green-dark), var(--teal)); box-shadow: 0 8px 24px rgba(18,79,64,.28);
      font-size: 14px; font-weight: 900; text-decoration: none;
    }
    @media (max-width: 820px) {
      .topbar { padding-right: max(18px, env(safe-area-inset-right)); padding-left: max(18px, env(safe-area-inset-left)); }
      .wrap { width: calc(100% - 28px); }
      .hero { margin-top: 20px; border-radius: 22px; }
      .section-head { display: block; }
      .section-head p { margin-top: 6px; }
      .shop-grid { grid-template-columns: minmax(0, 1fr); gap: 14px; }
      .shop-name { font-size: 17px; }
      .shop-card { grid-template-columns: minmax(0, 1fr) 220px; padding: 17px; }
      .shop-placeholder { min-height: 320px; height: 320px; }
      .note { margin-bottom: 24px; }
    }
    @media (max-width: 560px) {
      .shop-card { grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 16px; }
      .shop-placeholder { grid-column: 1; grid-row: auto; height: 250px; min-height: 250px; font-size: 70px; }
    }
    @media (max-width: 420px) {
      .topbar { min-height: 0; padding-top: max(10px, env(safe-area-inset-top)); padding-bottom: 10px; align-items: flex-start; flex-direction: column; gap: 4px; }
      .brand { max-width: none; font-size: 14px; }
      .back { font-size: 13px; }
      .wrap { width: calc(100% - 24px); }
      .hero { padding: 26px 22px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="../index.html">西双版纳 · 普洱 7天6晚</a>
    <a class="back" href="../index.html#days">← 返回每日行程</a>
  </header>

  <main class="wrap">
    <section class="hero" aria-labelledby="page-title">
      <div class="eyebrow">DAY 1 <span>·</span> 10月13日</div>
      <h1 id="page-title">文創小店</h1>
      <p>吃完晚餐逛星光夜市，順路挑伴手禮。</p>
    </section>

    <div class="section-head">
      <h2>夜市文創</h2>
      <p>2 家 · 星光夜市內</p>
    </div>

    <section class="shop-grid" aria-label="文創小店">

      <article class="shop-card">
        <header class="shop-card-head">
          <span class="shop-name">万物香铺</span>
          <span class="hours">夜市营业时间</span>
        </header>
        <div class="shop-details">
          <p>文创香氛小店，适合挑伴手礼。</p>
        </div>
        <div class="shop-placeholder" aria-hidden="true">🪔</div>
      </article>

      <article class="shop-card">
        <header class="shop-card-head">
          <span class="shop-name">新华书店文创店</span>
          <span class="hours">夜市营业时间</span>
        </header>
        <div class="shop-details">
          <p>位於星光夜市內，文創產品價格合理，推薦逛逛。</p>
        </div>
        <div class="shop-placeholder" aria-hidden="true">📚</div>
      </article>

    </section>

    <p class="note">兩家都在星光夜市範圍內，晚餐後散步即可到達。</p>
  </main>

  <footer>10月13日文創小店 · <a href="../index.html#days">回到完整行程</a></footer>
  <a class="home-float" href="../index.html" aria-label="返回首页">⌂ 返回首页</a>
</body>

</html>
