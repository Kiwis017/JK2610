<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17684f">
  <title>10月13日晚餐推荐 · 西双版纳行程</title>
  <style>
    :root {
      --green: #17684f; --green-dark: #124f40; --teal: #147681; --orange: #db8244;
      --ink: #263a33; --muted: #718079; --paper: #f4f8f4; --card: #fff; --line: #dce8df;
      --shadow: 0 12px 34px rgba(27, 73, 54, .09);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      min-width: 320px; margin: 0; color: var(--ink);
      background: radial-gradient(circle at 90% 8%, rgba(212,235,222,.75), transparent 28rem), var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .topbar {
      min-height: 66px; padding: env(safe-area-inset-top) max(5vw, env(safe-area-inset-right)) 0 max(5vw, env(safe-area-inset-left));
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      background: rgba(255,255,255,.92); border-bottom: 1px solid rgba(220,232,223,.9);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    }
    .brand { text-decoration: none; font-weight: 900; color: var(--green-dark); }
    .back {
      display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 14px;
      border: 1px solid var(--line); border-radius: 999px; text-decoration: none;
      color: var(--green-dark); font-size: 13px; font-weight: 800; background: #fff; white-space: nowrap;
    }
    .wrap { width: min(1000px, calc(100% - 36px)); margin: 0 auto; padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left); }
    .hero {
      position: relative; overflow: hidden; margin: 34px auto 24px; padding: clamp(28px, 6vw, 58px);
      border-radius: 28px; color: #fff; background: linear-gradient(120deg, #15583f, #187b78); box-shadow: var(--shadow);
    }
    .hero::after { content: "🌙"; position: absolute; right: 7%; bottom: -35px; font-size: clamp(110px, 20vw, 190px); opacity: .13; transform: rotate(-12deg); pointer-events: none; }
    .eyebrow { display: inline-flex; gap: 8px; padding: 7px 12px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; background: rgba(255,255,255,.1); font-size: 12px; font-weight: 900; letter-spacing: .8px; }
    h1 { max-width: 750px; margin: 18px 0 10px; font-size: clamp(31px, 6vw, 50px); line-height: 1.12; }
    .hero p { max-width: 680px; margin: 0; color: rgba(255,255,255,.86); line-height: 1.8; font-size: 15px; }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; margin: 30px auto 15px; }
    .section-head h2 { margin: 0; font-size: 23px; color: var(--green-dark); }
    .dinner-card {
      display: grid; grid-template-columns: 60px minmax(0, 1fr); align-items: start; gap: 16px;
      padding: clamp(18px, 4vw, 26px); border: 1px solid var(--line); border-radius: 20px;
      background: var(--card); box-shadow: var(--shadow);
    }
    .dinner-icon { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 17px; background: #fff1e2; font-size: 28px; }
    .dinner-card h2 { margin: 0 0 8px; color: var(--green-dark); font-size: clamp(20px, 3vw, 24px); }
    .dinner-card p { margin: 0; color: var(--ink); font-size: 15px; line-height: 1.8; }
    .tag { display: inline-block; margin-top: 12px; padding: 5px 10px; border-radius: 999px; color: #76533a; background: #fff3e8; font-size: 12px; font-weight: 800; }
    footer { padding: 24px 18px max(34px, env(safe-area-inset-bottom)); text-align: center; color: var(--muted); font-size: 12px; }
    footer a { color: var(--green); font-weight: 800; }
    .home-float {
      position: fixed; z-index: 20; left: max(16px, env(safe-area-inset-left)); right: auto; bottom: max(18px, env(safe-area-inset-bottom));
      display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 48px; padding: 0 17px;
      border: 1px solid rgba(255,255,255,.5); border-radius: 999px; color: #fff;
      background: linear-gradient(120deg, var(--green-dark), var(--teal)); box-shadow: 0 8px 24px rgba(18,79,64,.28);
      font-size: 14px; font-weight: 900; text-decoration: none;
    }
    .home-float:focus-visible, .back:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
    @media (max-width: 820px) {
      .topbar { padding-right: max(18px, env(safe-area-inset-right)); padding-left: max(18px, env(safe-area-inset-left)); }
      .wrap { width: calc(100% - 28px); }
      .hero { margin-top: 20px; border-radius: 22px; }
      .section-head { display: block; }
    }
    @media (max-width: 420px) {
      .topbar { min-height: 0; padding-top: max(10px, env(safe-area-inset-top)); padding-bottom: 10px; align-items: flex-start; flex-direction: column; gap: 4px; }
      .brand { font-size: 14px; }
      .wrap { width: calc(100% - 24px); }
      .hero { padding: 26px 22px; }
      .dinner-card { grid-template-columns: 46px minmax(0, 1fr); gap: 12px; }
      .dinner-icon { width: 44px; height: 44px; border-radius: 14px; font-size: 23px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html">西双版纳 · 普洱 7天6晚</a>
    <a class="back" href="../index.html#days">← 返回每日行程</a>
  </header>
  <main class="wrap">
    <section class="hero" aria-labelledby="page-title">
      <div class="eyebrow">DAY 1 <span>·</span> 10月13日</div>
      <h1 id="page-title">晚餐推荐</h1>
      <p>晚餐安排参考每日行程表中的建议。</p>
    </section>
    <div class="section-head"><h2>夜市晚餐</h2></div>
    <article class="dinner-card">
      <span class="dinner-icon" aria-hidden="true">🍢</span>
      <div>
        <h2>湄公河·星光夜市</h2>
        <p>傣味小吃与烧烤，可边逛夜市边选择喜欢的摊位。</p>
        <span class="tag">傣味小吃 · 烧烤 · 夜市</span>
      </div>
    </article>
  </main>
  <footer>10月13日晚餐推荐 · <a href="../index.html#days">回到完整行程</a></footer>
  <a class="home-float" href="../index.html" aria-label="返回首页">⌂ 返回首页</a>
</body>
</html>
